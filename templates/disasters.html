{% extends "base.html" %}
{% block title %}Disaster Reports - DMS{% endblock %}
{% block content %}
<h1>Emergency Disaster Reporting</h1>
<div class="page-sub">Report, track, and analyze disaster incidents</div>
<div id="msg"></div>

<div class="panel">
  <div class="toolbar">
    <input id="f-q" placeholder="Search by name...">
    <select id="f-type"><option value="">All Types</option></select>
    <select id="f-location"><option value="">All Districts</option></select>
    <select id="f-status">
      <option value="">All Status</option>
      <option>Reported</option><option>Under Assessment</option><option>Active Response</option>
      <option>Partially Controlled</option><option>Resolved</option>
    </select>
    <button onclick="loadDisasters()">Filter</button>
    <button class="secondary" onclick="openCreate()">+ Report New Disaster</button>
  </div>
  <div id="table"></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3>Report New Disaster</h3>
    <div class="form-row"><label>Disaster Name</label><input id="m-name"></div>
    <div class="form-row"><label>Disaster Type</label><select id="m-type"></select></div>
    <div class="form-row"><label>Location (District)</label><select id="m-location"></select></div>
    <div class="form-row"><label>Description</label><textarea id="m-desc" rows="3"></textarea></div>
    <div class="form-row"><label>Estimated Affected Population</label><input id="m-affected" type="number" value="1000"></div>
    <div class="form-row"><label>Infrastructure Damage (%)</label><input id="m-damage" type="number" value="20"></div>
    <div class="form-actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button onclick="submitCreate()">Save Disaster</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let lookups = null;

async function loadLookups() {
  lookups = await apiGet("/disasters/api/lookups");
  const typeOpts = lookups.types.map(t => `<option value="${t.type_name}">${t.type_name}</option>`).join("");
  document.getElementById("f-type").insertAdjacentHTML("beforeend", typeOpts);
  document.getElementById("m-type").innerHTML = lookups.types.map(t => `<option value="${t.disaster_type_id}">${t.type_name}</option>`).join("");

  const locOpts = lookups.locations.map(l => `<option value="${l.location_id}">${l.district_name}</option>`).join("");
  document.getElementById("f-location").insertAdjacentHTML("beforeend", locOpts);
  document.getElementById("m-location").innerHTML = locOpts;
}

async function loadDisasters() {
  const params = new URLSearchParams();
  const q = document.getElementById("f-q").value;
  const type = document.getElementById("f-type").value;
  const loc = document.getElementById("f-location").value;
  const status = document.getElementById("f-status").value;
  if (q) params.set("q", q);
  if (type) params.set("type", type);
  if (loc) params.set("location_id", loc);
  if (status) params.set("status", status);

  const rows = await apiGet("/disasters/api/list?" + params.toString());
  renderTable("table", rows, [
    { label: "Name", key: "disaster_name" },
    { label: "Type", key: "type_name" },
    { label: "District", key: "district_name" },
    { label: "Affected", key: "estimated_affected" },
    { label: "Severity", render: r => badge(r.severity_level) + ` (${r.severity_score})` },
    { label: "Status", render: r => badge(r.status) },
    { label: "Reported", render: r => new Date(r.reported_at).toLocaleDateString() },
    { label: "Actions", render: r => `
       <div class="table-actions">
         <button class="secondary" onclick="recalcSeverity(${r.disaster_id})">Recalc Severity</button>
         <button class="secondary" onclick="viewSummary(${r.disaster_id})">Summary</button>
       </div>
     ` },
  ]);
}

function openCreate() { document.getElementById("modal").classList.add("show"); }
function closeModal() { document.getElementById("modal").classList.remove("show"); }

async function submitCreate() {
  try {
    await apiSend("/disasters/api/create", "POST", {
      disaster_name: document.getElementById("m-name").value,
      disaster_type_id: document.getElementById("m-type").value,
      location_id: document.getElementById("m-location").value,
      description: document.getElementById("m-desc").value,
      estimated_affected: Number(document.getElementById("m-affected").value),
      infrastructure_damage_pct: Number(document.getElementById("m-damage").value),
    });
    closeModal();
    showMsg("msg", "Disaster reported successfully. Severity auto-calculated by trigger.", "success");
    loadDisasters();
  } catch (e) {
    showMsg("msg", e.message, "error");
  }
}

async function recalcSeverity(id) {
  try {
    const r = await apiGet(`/disasters/api/${id}/severity`);
    showMsg("msg", `Severity recalculated: ${r.severity_level} (score ${r.severity_score})`, "success");
    loadDisasters();
  } catch (e) { showMsg("msg", e.message, "error"); }
}

async function viewSummary(id) {
  try {
    const s = await apiGet(`/disasters/api/${id}/summary`);
    alert(`Disaster: ${s.disaster_name}\nSeverity: ${s.severity_level} (${s.severity_score})\n` +
      `Total Victims: ${s.total_victims}\nDeceased: ${s.deceased}\nRescued: ${s.rescued}\n` +
      `Still Missing: ${s.still_missing}\nTeams Assigned: ${s.teams_assigned}\nMissions: ${s.total_missions}\n` +
      `Relief Distributed: ${s.relief_units_distributed}\nPeople Sheltered: ${s.people_sheltered}\n` +
      `Blood Units Requested: ${s.blood_units_requested}`);
  } catch (e) { showMsg("msg", e.message, "error"); }
}

loadLookups().then(loadDisasters);
</script>
{% endblock %}
