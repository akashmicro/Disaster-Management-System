{% extends "auth_base.html" %}{% block title %}Create Account - DMS{% endblock %}{% block content %}<h1>Create Account</h1><form method="post"><label>Name<input name="full_name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" type="tel" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Confirm Password<input name="confirm_password" type="password" minlength="8" required></label><button class="button w-100" type="submit">CREATE ACCOUNT</button></form><p class="mt-3"><a href="/login">Back to login</a></p>{% endblock %}
