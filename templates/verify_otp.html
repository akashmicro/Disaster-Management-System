{% extends "auth_base.html" %}{% block title %}Verify OTP - DMS{% endblock %}{% block content %}<h1>Verify OTP</h1><p class="text-muted">The code expires in 10 minutes.</p>{% if debug_otp %}<div class="alert alert-info">Development OTP: <strong>{{ debug_otp }}</strong></div>{% endif %}<form method="post"><label>Six-digit OTP<input name="otp" inputmode="numeric" pattern="\d{6}" maxlength="6" required></label><button class="button w-100" type="submit">VERIFY OTP</button></form><form method="post" action="/resend-otp" class="mt-3"><button class="btn btn-link" type="submit">Resend OTP</button></form>{% endblock %}
