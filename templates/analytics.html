{% extends "base.html" %}{% block content %}<h1>Analytics</h1>{% for name,rows in stats.items() %}<section class="panel"><h2>{{ name.replace("_"," ")|title }}</h2><table><tr><th>Label</th><th>Value</th></tr>{% for row in rows %}<tr><td>{{ row.label }}</td><td>{{ row.value }}</td></tr>{% else %}<tr><td colspan="2">No data yet.</td></tr>{% endfor %}</table></section>{% endfor %}{% endblock %}
